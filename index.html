<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BLOODLIT TEMPLE</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .title {
      letter-spacing: 0.12em;
      font-size: 12px;
      opacity: 0.85;
    }

    .status {
      font-size: 11px;
      opacity: 0.6;
    }

    .cursor::after {
      content: "▍";
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="title">BLOODLIT TEMPLE</div>
    <div class="status cursor">system initializing</div>
  </div>
</body>
